<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>

    <!-- Vibrant Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Filter for soft glows -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.4; }
        50% { transform: translateY(-15px) scale(1.15); opacity: 0.8; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.05); }
      }
      @keyframes dashStream {
        to { stroke-dashoffset: -40; }
      }
      @keyframes barGrow {
        0%, 100% { transform: scaleY(0.7); }
        50% { transform: scaleY(1); }
      }
      @keyframes nodePulse {
        0%, 100% { r: 5; opacity: 0.6; }
        50% { r: 7; opacity: 1; }
      }
      .bg-pulse { transform-origin: center; animation: pulseGlow 8s ease-in-out infinite; }
      .p1 { animation: floatParticle 5s ease-in-out infinite; }
      .p2 { animation: floatParticle 7s ease-in-out infinite 1.5s; }
      .p3 { animation: floatParticle 6s ease-in-out infinite 3s; }
      .stream-line { stroke-dasharray: 6 6; animation: dashStream 3s linear infinite; }
      .bar-anim-1 { transform-origin: bottom; animation: barGrow 4s ease-in-out infinite; }
      .bar-anim-2 { transform-origin: bottom; animation: barGrow 4s ease-in-out infinite 1s; }
      .bar-anim-3 { transform-origin: bottom; animation: barGrow 4s ease-in-out infinite 2s; }
      .node-anim { animation: nodePulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Subtle Tech Grid Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Ambient Light Orbs (Background Glows) -->
  <circle cx="200" cy="80" r="160" fill="url(#glowGrad1)" class="bg-pulse"/>
  <circle cx="1020" cy="240" r="180" fill="url(#glowGrad2)" class="bg-pulse"/>

  <!-- Dynamic Animated Graph & Pipeline Graphic Elements (Right Side / Background) -->
  <g opacity="0.65" transform="translate(780, 50)">
    <!-- Campaign Automation Flow nodes & connectors -->
    <path d="M 40 180 C 100 120, 160 220, 240 150 S 320 70, 380 110" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" class="stream-line"/>
    <path d="M 40 220 C 110 260, 180 140, 270 190 S 330 220, 390 170" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" class="stream-line" style="animation-duration: 4.5s;"/>

    <!-- Dynamic Flow Nodes -->
    <circle cx="40" cy="180" r="6" fill="#38bdf8" class="node-anim"/>
    <circle cx="160" cy="200" r="5" fill="#818cf8" class="node-anim" style="animation-delay: 0.8s;"/>
    <circle cx="240" cy="150" r="7" fill="#c084fc" class="node-anim" style="animation-delay: 1.5s;"/>
    <circle cx="380" cy="110" r="6" fill="#f43f5e" class="node-anim" style="animation-delay: 2.2s;"/>

    <!-- Animated Data Chart Bars -->
    <g transform="translate(180, 150)">
      <rect x="0" y="30" width="14" height="60" rx="4" fill="url(#barGrad)" class="bar-anim-1"/>
      <rect x="22" y="10" width="14" height="80" rx="4" fill="url(#barGrad)" class="bar-anim-2"/>
      <rect x="44" y="22" width="14" height="68" rx="4" fill="url(#barGrad)" class="bar-anim-3"/>
      <rect x="66" y="5" width="14" height="85" rx="4" fill="url(#barGrad)" class="bar-anim-1"/>
      <rect x="88" y="18" width="14" height="72" rx="4" fill="url(#barGrad)" class="bar-anim-2"/>
    </g>

    <!-- Marketing Channel Badges (Floating softly) -->
    <g transform="translate(60, 30)" class="p1">
      <rect width="78" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="39" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">✉ EMAIL</text>
    </g>
    <g transform="translate(240, 30)" class="p2">
      <rect width="68" height="26" rx="13" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="34" y="17" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ SMS</text>
    </g>
    <g transform="translate(300, 210)" class="p3">
      <rect width="80" height="26" rx="13" fill="#1e293b" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5"/>
      <text x="40" y="17" fill="#e879f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🔔 PUSH</text>
    </g>
  </g>

  <!-- Floating Ambient Particles -->
  <circle cx="100" cy="60" r="3" fill="#38bdf8" class="p1"/>
  <circle cx="450" cy="50" r="2.5" fill="#818cf8" class="p2"/>
  <circle cx="680" cy="290" r="3.5" fill="#c084fc" class="p3"/>
  <circle cx="280" cy="310" r="2" fill="#38bdf8" class="p2"/>

  <!-- Left / Foreground Content (Always crisp, unobstructed, high-contrast) -->
  <g transform="translate(80, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 65)">
      <rect width="265" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4.5" fill="#10b981" class="node-anim"/>
      <text x="32" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">CURATED STACK &amp; DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="155" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Marketing
    </text>
    <text x="0" y="208" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Campaign Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="252" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      The definitive guide to open-source &amp; enterprise multi-channel campaign automation platforms.
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 276)">
      <rect width="112" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
      <text x="56" y="16.5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🚀 Open Source</text>

      <rect x="122" width="105" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
      <text x="174" y="16.5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🏢 Enterprise SaaS</text>

      <rect x="237" width="118" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
      <text x="296" y="16.5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">📈 Visual Journeys</text>

      <rect x="365" width="112" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
      <text x="421" y="16.5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🛡️ Data Privacy</text>
    </g>
  </g>
</svg>
